name: Update published Sridevi Night results

on:
  schedule:
    # UTC: every 5 minutes from 19:15 IST until the end of the same IST day.
    - cron: '45,50,55 13 * * *'
    - cron: '*/5 14-17 * * *'
    - cron: '0,5,10,15,20,25 18 * * *'
    # Overnight freshness/deployment verification only; the updater does not fetch outside its window.
    - cron: '23 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://sridevinightchart.com' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check one-time deployment setup
        shell: bash
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo '::error::Add the VERCEL_DEPLOY_HOOK repository secret before enabling automatic publishing.'
            exit 1
          fi
      - run: npm ci
      - run: npm run validate-results
      - run: npm run update-results
      - run: npm run validate-results
      - run: npm test
      - name: Commit validated changes
        shell: bash
        run: |
          if ! git diff --quiet -- data/results.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/results.json
            git commit -m 'Update validated Sridevi Night results'
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi
      - name: Deploy and verify published data
        run: node scripts/publish-results.mjs
      - name: Check final daily result freshness
        if: github.event_name == 'schedule' && github.event.schedule == '23 20 * * *'
        run: npx tsx scripts/check-result-freshness.ts
